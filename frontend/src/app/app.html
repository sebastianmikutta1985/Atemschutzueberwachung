<app-alarm-overlay />
<router-outlet />

@if (idleWarningOpen()) {
  <app-dialog [heading]="'app.idleTitle' | t" icon="clock" tone="warn" (close)="stayLoggedIn()">
    <p>{{ 'app.idleText' | t }}</p>
    <div dialog-actions class="dialog__actions">
      <button appButton variant="ghost" icon="logout" type="button" (click)="logoutNow()">{{ 'app.logoutNow' | t }}</button>
      <button appButton variant="primary" type="button" (click)="stayLoggedIn()">{{ 'app.stayLoggedIn' | t }}</button>
    </div>
  </app-dialog>
}
