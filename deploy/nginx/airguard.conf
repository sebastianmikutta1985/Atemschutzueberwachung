server {
    server_name crew-trace.com www.crew-trace.com;

    root /var/www/airguard/web;

    location /api/ {
        proxy_pass http://127.0.0.1:5114;
        include /etc/nginx/snippets/airguard-proxy.conf;
    }

    location /hubs/ {
        proxy_pass http://127.0.0.1:5114;
        include /etc/nginx/snippets/airguard-proxy.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 1h;
    }

    # Service Worker, Manifest und index.html nie zwischenspeichern, sonst kommen Updates nicht an.
    location ~ ^/(ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js|manifest\.webmanifest|index\.html)$ {
        include /etc/nginx/snippets/airguard-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        include /etc/nginx/snippets/airguard-headers.conf;
        try_files $uri /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/crew-trace.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/crew-trace.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.crew-trace.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = crew-trace.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name crew-trace.com www.crew-trace.com;
    return 404; # managed by Certbot
}
